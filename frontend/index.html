<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        const stored = localStorage.getItem("expensesnap.theme");
        const theme =
          stored === "light" || stored === "dark"
            ? stored
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.theme = theme;
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor)
          themeColor.setAttribute("content", theme === "dark" ? "#0c0c09" : "#ffffff");
      } catch {
        document.documentElement.dataset.theme = "light";
        const themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) themeColor.setAttribute("content", "#ffffff");
      }
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta
      name="description"
      content="ExpenseSnap — registo simples e consciente das suas despesas."
    />
    <link rel="preload" href="/icon.svg" as="image" type="image/svg+xml" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..800&amp;family=IBM+Plex+Mono:wght@500;600;700&amp;family=Zalando+Sans+Expanded:wght@500..800&amp;display=swap"
      rel="stylesheet"
    />
    <title>ExpenseSnap — As suas despesas, com clareza</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
